<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上下肢訓練紀錄</title>
<style>
:root{
  --bg:#f4f2ec;--card:#fffdf9;--sub:#f1efe9;--line:#dcd7cd;
  --teal:#275356;--teal-h:#1e4245;--teal-l:#e6eff0;
  --red:#783f3a;--red-l:#f7ecea;
  --ink:#242828;--muted:#686d6d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Microsoft JhengHei','PingFang TC',-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.55;overflow-x:hidden}
body{padding-bottom:88px}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 28px}

/* Header */
header{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start;box-shadow:0 2px 10px rgba(36,40,40,.03)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
h1{margin:0 0 8px;font-size:26px;color:var(--ink);letter-spacing:.03em}
.sub{margin:0;font-size:14.5px;color:var(--muted);line-height:1.65}
.meta-grid{display:grid;gap:10px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,select,textarea,button{font-family:inherit;font-size:15px;color:var(--ink)}
input,select,textarea{width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{resize:vertical;min-height:74px}

.timer-box{background:var(--sub);border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:grid;gap:8px}
.timer-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer-disp{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.timer-btns{display:flex;gap:6px}
.min-row{display:flex;align-items:center;gap:8px}
.min-row input{background:#fff;padding:6px 10px;font-size:14px}

.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:8px;padding:8px 15px;font-weight:700;cursor:pointer;transition:background .15s,opacity .15s}
.btn:hover{background:var(--teal-h)}
.btn-out{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-out:hover{background:var(--sub)}
.btn-red-out{background:#fff;border-color:var(--red);color:var(--red)}
.btn-red-out:hover{background:var(--red-l)}
.btn-sm{padding:6px 11px;font-size:13.5px}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:20;background:rgba(244,242,236,.95);backdrop-filter:blur(6px);padding:8px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 16px;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .15s}
.tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.panel{display:none}
.panel.active{display:block}

/* Exercise Card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(36,40,40,.025)}
.ex-top{display:grid;grid-template-columns:minmax(200px,1.15fr) minmax(175px,1fr) minmax(200px,1fr);gap:16px;align-items:center;margin-bottom:14px}
.fig-col{display:flex;flex-direction:column;gap:5px}
.fig-lbl{font-size:12px;font-weight:700;color:var(--muted)}
.fig-box{background:var(--sub);border:1px solid #e5e1d8;border-radius:10px;padding:6px;display:flex;align-items:center;justify-content:center;min-height:132px;overflow:hidden}
.fig-box svg{width:100%;height:122px;display:block}
.ex-info{padding-left:6px}
.ex-role{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.03em}
.ex-name{margin:0 0 6px;font-size:21px;font-weight:700;color:var(--ink);line-height:1.3}
.ex-reps{font-size:14px;font-weight:700;color:var(--teal)}

details{background:var(--sub);border:1px solid #e5e1d8;border-radius:9px;padding:9px 12px;margin-bottom:12px}
summary{font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';color:var(--teal);font-size:13px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.tips-ul{margin:8px 0 7px;padding-left:20px}
.tips-ul li{margin-bottom:4px;font-size:14px;color:var(--ink)}
.warn{background:var(--red-l);border-left:3px solid var(--red);padding:6px 10px;border-radius:5px;font-weight:700;color:var(--red);font-size:13.5px}

/* Set Table */
.set-hdr,.set-row{display:grid;grid-template-columns:36px 52px 1.2fr 1.2fr 0.9fr;gap:10px;align-items:center}
.set-hdr{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 4px 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.set-hdr span:nth-child(1),.set-hdr span:nth-child(2){text-align:center}
.set-row{padding:3px 4px;border-radius:8px;margin-bottom:5px;transition:opacity .15s,background .15s}
.set-row.done{opacity:.45;background:var(--sub)}
.set-num{text-align:center;font-weight:700;color:var(--muted)}
.set-chk{width:19px;height:19px;margin:0 auto;display:block;accent-color:var(--teal);cursor:pointer}
.in-wrap{position:relative;display:flex;align-items:center}
.set-in{padding:7px 28px 7px 10px;font-size:14.5px;text-align:left}
.set-in.no-unit{padding-right:10px;text-align:center}
.unit{position:absolute;right:9px;font-size:12.5px;color:var(--muted);pointer-events:none}
.note-lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.ex-note{font-size:14px}

/* Core & History */
.core-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.url-row{display:grid;gap:8px}
.url-row .btn{width:fit-content}
.tip-box{background:var(--sub);border:1px solid var(--line);border-left:3px solid var(--teal);padding:11px 13px;border-radius:8px;font-size:13.5px;color:var(--ink);margin-top:14px}
.hist-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hist-head h2{margin:0;font-size:20px}
.hist-tools{display:flex;flex-wrap:wrap;gap:8px}
.hist-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.hist-tag{background:var(--red);color:#fff;font-size:13.5px;font-weight:700;padding:3px 10px;border-radius:6px}
.hist-meta{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.hist-ex{margin-bottom:7px;padding-bottom:7px;border-bottom:1px dashed var(--line)}
.hist-ex:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.hist-ex-t{font-weight:700;color:var(--teal);font-size:15px}
.hist-sets{font-size:14px;margin:2px 0}
.hist-note{font-size:13.5px;color:var(--red);font-weight:700}
.hist-link{color:var(--teal);font-weight:700;word-break:break-all}
.empty{text-align:center;color:var(--muted);padding:34px 12px;background:var(--card);border:1px dashed var(--line);border-radius:12px}

.foot{text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.bbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:30}
.bbar-in{max-width:960px;margin:0 auto;display:flex;gap:10px}
.hide{display:none!important}

@media (max-width:720px){
  .wrap{padding:12px 10px 24px}
  header{grid-template-columns:1fr;padding:15px}
  h1{font-size:22px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tab{padding:8px 4px;font-size:13.5px;text-align:center}
  .card{padding:14px 12px}
  .ex-top{grid-template-columns:1fr 1fr;gap:10px}
  .ex-info{grid-column:1 / -1;order:-1;padding-left:0;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px}
  .fig-box{min-height:108px;padding:4px}
  .fig-box svg{height:102px}
  .set-hdr,.set-row{grid-template-columns:24px 36px 1fr 1fr 0.78fr;gap:6px}
  .set-in{padding:7px 22px 7px 6px;font-size:14px}
  .unit{right:6px;font-size:11.5px}
  .core-grid{grid-template-columns:1fr}
  .bbar-in{display:grid;grid-template-columns:1.6fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow">TRAINING LOG</div>
    <h1>上下肢訓練紀錄</h1>
    <p class="sub">臀部優先、腿部維持、上肢推拉平衡，完整記下重量、次數、RIR 與訓練狀態。</p>
  </div>
  <div class="meta-grid">
    <div class="field">
      <label for="dt">訓練日期與時間</label>
      <input type="datetime-local" id="dt">
    </div>
    <div class="field">
      <label for="status">本次狀態</label>
      <select id="status">
        <option>正常</option>
        <option>精神很好</option>
        <option>稍累</option>
        <option>跳舞後腿疲勞</option>
        <option>需減量</option>
        <option>其他</option>
      </select>
      <input type="text" id="statusOther" class="hide" style="margin-top:6px" placeholder="請輸入本次狀態...">
    </div>
    <div class="field">
      <label>總訓練時長</label>
      <div class="timer-box">
        <div class="timer-top">
          <div class="timer-disp" id="tDisp">00:00</div>
          <div class="timer-btns">
            <button type="button" class="btn btn-sm" id="tBtn">開始</button>
            <button type="button" class="btn btn-out btn-sm" id="tRst">歸零</button>
          </div>
        </div>
        <div class="min-row">
          <input type="number" id="totalMin" inputmode="numeric" min="0" placeholder="也可手動輸入分鐘">
        </div>
      </div>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button type="button" class="tab active" data-t="lower">下肢日</button>
  <button type="button" class="tab" data-t="upper">上肢日</button>
  <button type="button" class="tab" data-t="core">核心腹肌</button>
  <button type="button" class="tab" data-t="history">歷史紀錄</button>
</nav>

<section id="p-lower" class="panel active"></section>
<section id="p-upper" class="panel"></section>

<section id="p-core" class="panel">
  <div class="card">
    <h2 class="ex-name" style="margin-bottom:6px">核心腹肌訓練</h2>
    <p class="sub" style="margin-bottom:14px">若要修腰、緊腹、穩定核心，以短程捲腹、下腹、核心穩定為主。可貼跟練影片，也可不貼影片，照樣能記錄本次核心。</p>
    <div class="field">
      <label for="cUrl">跟練影片網址（選填）</label>
      <div class="url-row">
        <input type="url" id="cUrl" placeholder="貼上 YouTube 或其他影片網址">
        <button type="button" class="btn btn-sm" id="openVid">▶ 開啟影片</button>
      </div>
    </div>
    <div class="core-grid">
      <div class="field">
        <label for="cMin">核心實做分鐘</label>
        <input type="number" id="cMin" inputmode="numeric" min="0" value="10">
      </div>
      <div class="field">
        <label for="cComp">完成程度</label>
        <select id="cComp">
          <option>完整完成</option>
          <option>約75%</option>
          <option>約50%</option>
          <option>未完成</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-top:12px">
      <label for="cNote">本次備註</label>
      <textarea id="cNote" placeholder="例如 8 分鐘、捲腹後段有點出力過度、下次再調"></textarea>
    </div>
    <div class="tip-box">細腰方向：以短程捲腹、反向捲腹、Dead Bug、棒式為主，大量負重旋轉與側彎不列為主力。</div>
  </div>
</section>

<section id="p-history" class="panel">
  <div class="card">
    <div class="hist-head">
      <h2>歷史紀錄</h2>
      <div class="hist-tools">
        <button type="button" class="btn btn-out btn-sm" id="btnExp">匯出備份</button>
        <button type="button" class="btn btn-out btn-sm" id="btnImp">匯入備份</button>
        <button type="button" class="btn btn-red-out btn-sm" id="btnClrAll">清除全部</button>
      </div>
    </div>
    <input type="file" id="impFile" accept=".json,application/json" class="hide">
    <div id="histList"></div>
  </div>
</section>

<footer class="foot">若有急性痛、尖銳關節痛、麻木或暈眩，請立即停止並視情況就醫。</footer>
</div>

<div class="bbar" id="bbar">
  <div class="bbar-in">
    <button type="button" class="btn" id="btnSave">完成並儲存</button>
    <button type="button" class="btn btn-out" id="btnClear">清空本次輸入</button>
  </div>
</div>

<script>
const KEY='fitnessTrackerGD_v2';
const $=id=>document.getElementById(id);

/* 依影片順序與內容配置 */
const LOWER=[
  {
    id:'hip_thrust',r:'臀部主力｜強度必練',n:'槓鈴臀推',rep:'建議 6–12｜可記錄 4 組',
    m:'glute',
    t:['上背靠在長椅邊緣，槓鈴加保護墊置於髖摺處','下巴微收、肋骨下壓，推起至頂端夾緊臀部停 1 秒','頂端時小腿盡量接近垂直地面'],
    w:'不要用腰椎過度後仰代償撐高'
  },
  {
    id:'sl_rdl',r:'臀部與腿後側｜單邊穩定',n:'扶支撐單腳 RDL',rep:'建議 8–12 / 側｜可記錄 4 組',
    m:'rdl',
    t:['一手輕扶深蹲架或固定支撐物，對側手持啞鈴','支撐腿膝蓋微彎固定，髖部往後推、上身前傾至腿後側有拉伸感','骨盆維持朝向地面不翻轉，起身時用臀部往前推回'],
    w:'若下背緊繃痠痛，請減輕重量並縮短下放幅度'
  },
  {
    id:'bulgarian',r:'單腳臀部｜線條修飾',n:'保加利亞蹲',rep:'建議 8–12 / 側｜可記錄 4 組',
    m:'bulg',
    t:['後腳背輕放長椅上，前腳離椅約一大步距離','上身微前傾使重心集中在支撐腳臀部','控制下蹲至前大腿接近水平，再由前腳跟推起'],
    w:'前膝勿向內扣，膝蓋不適就減小深度或先徒手'
  },
  {
    id:'leg_press',r:'腿部維持｜高腳位優先',n:'45 度腿推',rep:'建議 10–15｜可記錄 4 組',
    m:'legpress',
    t:['雙腳置於踏板偏上方、與肩同寬或略寬以增加臀部參與','下放到臀部與下背仍緊貼椅墊的最低點為止','推起時保留微彎，膝蓋不要完全鎖死'],
    w:'臀部捲起離開椅墊代表下放過深，需縮小行程'
  },
  {
    id:'abduction',r:'上臀｜臀部外展',n:'髖外展機',rep:'建議 12–20｜可記錄 4 組',
    m:'abduct',
    t:['坐穩並可將上身微微前傾，雙手輕扶前方把手','用臀部外側力量將雙膝向外推開，最外端停留 1 秒','控制速度慢慢回放，不讓配重片相撞'],
    w:'避免前後晃動身體借力'
  },
  {
    id:'adduction',r:'大腿內側｜收緊',n:'髖內收機',rep:'建議 10–15｜可記錄 4 組',
    m:'adduct',
    t:['背部貼穩椅背，先將起始開腿角度調整至無拉扯痛的範圍','吐氣時以大腿內側發力平穩夾緊並停頓 1 秒','吸氣時慢速控制回到起始位'],
    w:'若鼠蹊部出現刺痛，請立即調小開腿角度'
  }
];

const UPPER=[
  {
    id:'lat_pulldown',r:'垂直拉｜背闊肌',n:'滑輪下拉',rep:'建議 8–12｜可記錄 4 組',
    m:'lat',
    t:['握距略寬於肩，挺胸並先將肩胛骨下壓穩定','想像手肘垂直往下往腰側口袋方向拉動','拉至下巴到鎖骨上胸之間後緩慢回放'],
    w:'不要大幅度後仰甩動身體借力'
  },
  {
    id:'seated_row',r:'水平拉｜中背',n:'坐姿划船 / 平拉',rep:'建議 8–12｜可記錄 4 組',
    m:'row',
    t:['坐姿挺直、胸口微開，雙腳踩穩踏板','先向後收緊肩胛骨，再帶動手肘向後平拉','握把拉至下胸與肚臍之間停 1 秒，感受中背收縮'],
    w:'全程不要聳肩，避免腰部過度前彎或後倒'
  },
  {
    id:'chest_press',r:'水平推｜胸、三頭',n:'水平推壓式胸推機',rep:'建議 8–12｜可記錄 4 組',
    m:'chestpress',
    t:['調整座椅高度使握把對準胸中線位置','肩胛微收並將上背貼穩椅背，手肘略低於肩線','穩定向前推出，頂端手肘保留微彎不鎖死'],
    w:'推起時若肩膀往前聳起，請調降重量'
  },
  {
    id:'rev_fly',r:'後三角｜中上背',n:'反向蝴蝶機',rep:'建議 12–15｜可記錄 4 組',
    m:'reardelt',
    t:['面向椅背坐穩，胸口輕靠軟墊，握把與肩同高','手肘維持微彎固定，將雙臂向兩側後方平穩展開','專注於後肩與上背發力，慢放回起始位置'],
    w:'不要聳肩或用斜方肌硬拉'
  },
  {
    id:'face_pull',r:'後肩｜姿勢穩定',n:'臉拉',rep:'建議 12–15｜可記錄 4 組',
    m:'facepull',
    t:['滑輪調至約臉部或上胸高度，雙手抓繩索兩端往後站穩','向額頭與雙耳方向拉開繩索，保持手肘略高或與肩同高','末端做肩外旋停留 1 秒，感受後肩與旋轉肌收縮'],
    w:'核心收緊，不要身體向後仰借力'
  },
  {
    id:'pec_fly',r:'胸大肌孤立｜塑形',n:'蝴蝶機夾胸',rep:'建議 10–15｜可記錄 4 組',
    m:'pecfly',
    t:['背與頭穩靠椅墊，肩膀下沉不聳起','手肘維持微彎角度，像環抱大樹般往胸前合攏','回程張開到胸口有舒適伸展感即可，不需過度向後'],
    w:'避免手臂拉超過身體後方造成肩前側壓力'
  },
  {

function setNow(){
  const d=new Date();

        <div class="in-wrap"><input type="number" step="0.5" inputmode="decimal" class="set-in no-unit in-rir" placeholder="2"></div>
      </div>`;
    }
    const tips=ex.t.map(x=>`<li>${x}</li>`).join('');
    return `<div class="card ex-card" data-i="${i}">
      <div class="ex-top">
        <div class="fig-col">
          <div class="fig-lbl">動作圖示</div>

          <div class="ex-role">${ex.r}</div>

let curTab='lower',tSec=0,tBase=0,tStart=0,tId=null,manualMin=false;
const pad=n=>String(n).padStart(2,'0');

function updTimer(){
  $('tDisp').textContent=pad(Math.floor(tSec/60))+':'+pad(tSec%60);
  if(!manualMin&&tSec>0)$('totalMin').value=Math.max(1,Math.round(tSec/60));
}
function stopTimer(){if(tId){clearInterval(tId);tId=null;}}
function resetTimer(){
  stopTimer();tSec=0;tBase=0;tStart=0;manualMin=false;
  $('tDisp').textContent='00:00';$('tBtn').textContent='開始';$('totalMin').value='';
}

$('tBtn').onclick=()=>{
  if(tId){
    tSec=tBase+Math.floor((Date.now()-tStart)/1000);
    tBase=tSec;stopTimer();updTimer();$('tBtn').textContent='繼續';
  }else{
    tStart=Date.now();
    tId=setInterval(()=>{tSec=tBase+Math.floor((Date.now()-tStart)/1000);updTimer();},500);
    $('tBtn').textContent='暫停';
  }
};
$('tRst').onclick=resetTimer;
$('totalMin').oninput=()=>{manualMin=true;};
$('status').onchange=()=>{$('statusOther').classList.toggle('hide',$('status').value!=='其他');};

$('openVid').onclick=()=>{
  let u=$('cUrl').value.trim();
  if(!u){alert('請先輸入影片網址');return;}
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  window.open(u,'_blank','noopener');
};

document.addEventListener('change',e=>{
  if(e.target.classList.contains('set-chk')){
    e.target.closest('.set-row').classList.toggle('done',e.target.checked);
  }
});

function switchTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+t));
  $('bbar').classList.toggle('hide',t==='history');
  if(t==='history')renderHist();
  window.scrollTo({top:0,behavior:'smooth'});
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)switchTab(b.dataset.t);};

function loadRecs(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(d)?d:[];}
  catch(e){return [];}
}
function saveRecs(arr){localStorage.setItem(KEY,JSON.stringify(arr));}

function clearCurrent(ask){
  if(ask&&!confirm('確定要清空本次輸入嗎？'))return;
  if(curTab==='core'){
    $('cUrl').value='';$('cMin').value='10';$('cComp').value='完整完成';$('cNote').value='';
  }else if(curTab==='lower'||curTab==='upper'){
    const p=$('p-'+curTab);
    p.querySelectorAll('.set-in,.ex-note').forEach(el=>el.value='');
    p.querySelectorAll('.set-chk').forEach(el=>el.checked=false);
    p.querySelectorAll('.set-row').forEach(el=>el.classList.remove('done'));
  }
}
$('btnClear').onclick=()=>clearCurrent(true);

$('btnSave').onclick=()=>{
  const st=$('status').value==='其他'?($('statusOther').value.trim()||'其他'):$('status').value;
  if(tId){
    tSec=tBase+Math.floor((Date.now()-tStart)/1000);
    tBase=tSec;stopTimer();updTimer();$('tBtn').textContent='繼續';
  }
  const tMin=$('totalMin').value.trim();
  const rec={id:Date.now(),dt:$('dt').value,status:st,totalMin:tMin,timer:$('tDisp').textContent};
  if(curTab==='core'){
    rec.type='核心腹肌';
    rec.core={url:$('cUrl').value.trim(),min:$('cMin').value.trim()||'0',comp:$('cComp').value,note:$('cNote').value.trim()};
  }else{
    rec.type=curTab==='lower'?'下肢日':'上肢日';
    const src=curTab==='lower'?LOWER:UPPER;
    const items=[];let filled=0;
    $('p-'+curTab).querySelectorAll('.ex-card').forEach((c,i)=>{
      const sets=[];
      c.querySelectorAll('.set-row').forEach((r,idx)=>{
        const w=r.querySelector('.in-w').value.trim();
        const rp=r.querySelector('.in-r').value.trim();
        const rir=r.querySelector('.in-rir').value.trim();
        if(w!==''||rp!==''||rir!==''){
          sets.push({s:idx+1,w,r:rp,rir,done:r.querySelector('.set-chk').checked});
          filled++;
        }
      });
      const note=c.querySelector('.ex-note').value.trim();
      if(sets.length||note)items.push({name:src[i].n,sets,note});
    });
    if(!filled){alert('下肢或上肢訓練至少要填寫一組才能儲存。');return;}
    rec.items=items;
  }
  const all=loadRecs();all.push(rec);saveRecs(all);
  clearCurrent(false);resetTimer();setNow();
  alert('已儲存本次紀錄！');switchTab('history');
};

function renderHist(){
  const list=loadRecs().sort((a,b)=>(b.dt||'').localeCompare(a.dt||'')||(b.id-a.id));
  if(!list.length){$('histList').innerHTML='<div class="empty">目前尚無訓練紀錄</div>';return;}
  $('histList').innerHTML=list.map(r=>{
    const dur=r.totalMin?(r.totalMin+' 分鐘'):(r.timer&&r.timer!=='00:00'?r.timer:'未填');
    let body='';
    if(r.type==='核心腹肌'&&r.core){
      const c=r.core;
      let uHtml='';
      if(c.url){
