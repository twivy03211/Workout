<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上下肢訓練紀錄</title>
<style>
:root{
  --bg:#f6f4ef;--card:#fffdf9;--sub:#eeebe4;--line:#d8d3c8;
  --teal:#284c51;--teal-l:#e8eff0;--red:#78443f;--red-l:#f6ecea;
  --ink:#262929;--muted:#636868;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Microsoft JhengHei',-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden}
body{padding-bottom:92px}
.wrap{max-width:480px;margin:0 auto;padding:12px 12px 24px}
header{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:10px;padding:14px;margin-bottom:12px}
.title-row{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:21px;color:var(--teal);letter-spacing:.04em}
.sub{margin:4px 0 12px;font-size:16px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px}
.meta-grid{display:grid;gap:10px}
.field label{display:block;font-size:16px;font-weight:700;color:var(--teal);margin-bottom:4px}
input,select,textarea,button{font-family:inherit;font-size:16px;color:var(--ink)}
input,select,textarea{width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{resize:vertical;min-height:68px}
.timer-box{background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.timer-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer-disp{font-size:24px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.timer-btns{display:flex;gap:6px}
.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:7px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn-out{background:#fff;color:var(--teal)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}
.btn-red-out{background:#fff;border-color:var(--red);color:var(--red)}
.btn-sm{padding:6px 10px;font-size:15px}
.min-row{display:flex;align-items:center;gap:8px}
.min-row span{white-space:nowrap;font-size:16px;font-weight:700;color:var(--muted)}
.min-row input{max-width:96px;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:9px 2px;font-size:15px;font-weight:700;text-align:center;cursor:pointer}
.tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.ex-info{flex:1;min-width:0}
.ex-role{display:inline-block;font-size:14px;font-weight:700;color:var(--teal);background:var(--teal-l);padding:2px 8px;border-radius:4px;margin-bottom:4px}
.ex-name{margin:0;font-size:18px;font-weight:700;color:var(--ink)}
.ex-reps{margin:3px 0 0;font-size:16px;color:var(--red);font-weight:700}
.ex-svg{flex:0 0 74px;text-align:center;background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:4px 2px}
.ex-svg svg{display:block;margin:0 auto;width:54px;height:68px}
.ex-muscle{font-size:12px;font-weight:700;color:var(--red);line-height:1.2;margin-top:2px}
details{background:var(--sub);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:10px}
summary{font-weight:700;color:var(--teal);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'＋';color:var(--teal)}
details[open] summary::after{content:'－'}
.tips-ul{margin:8px 0 6px;padding-left:18px}
.tips-ul li{font-weight:700;margin-bottom:4px;font-size:16px;color:var(--ink)}
.warn{background:var(--red-l);border-left:3px solid var(--red);padding:6px 8px;border-radius:4px;font-weight:700;color:var(--red);font-size:16px}
.set-hdr,.set-row{display:grid;grid-template-columns:28px 34px 1fr 1fr 1fr;gap:6px;align-items:center;text-align:center}
.set-hdr{font-size:14px;font-weight:700;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:6px}
.set-row{margin-bottom:6px;padding:2px 0;border-radius:6px;transition:opacity .15s}
.set-row.done{opacity:.42;background:var(--sub)}
.set-num{font-weight:700;color:var(--teal)}
.set-chk{width:22px;height:22px;margin:0 auto;accent-color:var(--teal);cursor:pointer}
.set-in{padding:7px 4px;text-align:center;font-size:16px}
.ex-note{margin-top:8px}
.info-box{background:var(--teal-l);border-left:3px solid var(--teal);padding:10px;border-radius:6px;font-size:16px;margin-top:10px}
.tip-box{background:var(--red-l);border-left:3px solid var(--red);padding:10px;border-radius:6px;font-size:16px;font-weight:700;color:var(--red);margin-top:10px}
.url-row{display:flex;gap:8px}
.url-row button{white-space:nowrap}
.hist-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.hist-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:8px;padding:12px;margin-bottom:10px}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.hist-tag{background:var(--teal);color:#fff;font-size:15px;font-weight:700;padding:2px 8px;border-radius:4px}
.hist-meta{font-size:15px;color:var(--muted);margin-bottom:8px}
.hist-ex{margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.hist-ex:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.hist-ex-t{font-weight:700;color:var(--teal)}
.hist-sets{font-size:16px;margin:2px 0}
.hist-note{font-size:15px;color:var(--red);font-weight:700}
.hist-link{color:var(--teal);font-weight:700;word-break:break-all}
.empty{text-align:center;color:var(--muted);padding:28px 12px;background:var(--card);border:1px dashed var(--line);border-radius:10px}
.foot{text-align:center;font-size:16px;font-weight:700;color:var(--red);border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
.bbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.96);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:30}
.bbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:8px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="title-row">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#284c51" stroke-width="2" stroke-linecap="round">
      <path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>
      <circle cx="12" cy="12" r="2" fill="#78443f" stroke="none"/>
    </svg>
    <h1>上下肢訓練紀錄</h1>
  </div>
  <p class="sub">臀部優先、腿部維持、上肢推拉平衡</p>
  <div class="meta-grid">
    <div class="field">
      <label for="dt">訓練日期時間</label>
      <input type="datetime-local" id="dt">
    </div>
    <div class="field">
      <label for="status">本次狀態</label>
      <select id="status">
        <option>正常</option>
        <option>精神很好</option>
        <option>稍累</option>
        <option>跳舞後腿疲勞</option>
        <option>需減量</option>
        <option>其他</option>
      </select>
      <input type="text" id="statusOther" class="hide" style="margin-top:6px" placeholder="請輸入本次狀態...">
    </div>
    <div class="field">
      <label>總訓練時長</label>
      <div class="timer-box">
        <div class="timer-top">
          <div class="timer-disp" id="tDisp">00:00</div>
          <div class="timer-btns">
            <button type="button" class="btn btn-sm" id="tBtn">開始</button>
            <button type="button" class="btn btn-out btn-sm" id="tRst">歸零</button>
          </div>
        </div>
        <div class="min-row">
          <span>總時長（分鐘）</span>
          <input type="number" id="totalMin" inputmode="numeric" min="0" placeholder="0">
        </div>
      </div>
    </div>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button type="button" class="tab active" data-t="lower">下肢日</button>
  <button type="button" class="tab" data-t="upper">上肢日</button>
  <button type="button" class="tab" data-t="core">核心腹肌</button>
  <button type="button" class="tab" data-t="history">歷史紀錄</button>
</nav>
<section id="p-lower" class="panel active"></section>
<section id="p-upper" class="panel"></section>
<section id="p-core" class="panel">
  <div class="card">
    <div class="ex-head">
      <div class="ex-info">
        <span class="ex-role">核心・腹肌訓練</span>
        <h2 class="ex-name">跟練影片紀錄</h2>
      </div>
      <div class="ex-svg" id="coreSvg"></div>
    </div>
    <div class="meta-grid">
      <div class="field">
        <label for="cUrl">影片網址</label>
        <div class="url-row">
          <input type="url" id="cUrl" placeholder="貼上 YouTube 或影片網址">
          <button type="button" class="btn btn-sm" id="openVid">▶ 開啟影片</button>
        </div>
      </div>
      <div class="field">
        <label for="cMin">核心實做分鐘</label>
        <input type="number" id="cMin" inputmode="numeric" min="0" value="10">
      </div>
      <div class="field">
        <label for="cComp">完成程度</label>
        <select id="cComp">
          <option>完整完成</option>
          <option>約75%</option>
          <option>約50%</option>
          <option>未完成</option>
        </select>
      </div>
      <div class="field">
        <label for="cNote">本次備註</label>
        <textarea id="cNote" placeholder="記錄動作感受或調整..."></textarea>
      </div>
    </div>
    <div class="info-box">頁首總訓練時長記整次訓練，核心分鐘只記腹肌段落，兩者不重複計算。</div>
    <div class="tip-box">提示：細腰方向以短程捲腹、反向捲腹、Dead Bug、棒式為主，大量負重旋轉與側彎不列為主力。</div>
  </div>
</section>
<section id="p-history" class="panel">
  <div class="hist-tools">
    <button type="button" class="btn btn-out btn-sm" id="btnExp">匯出備份</button>
    <button type="button" class="btn btn-out btn-sm" id="btnImp">匯入備份</button>
    <button type="button" class="btn btn-red-out btn-sm" id="btnClrAll">清除全部</button>
  </div>
  <input type="file" id="impFile" accept=".json,application/json" class="hide">
  <div id="histList"></div>
</section>
<footer class="foot">若出現關節刺痛、麻木或暈眩，立即停止。</footer>
</div>
<div class="bbar" id="bbar">
  <div class="bbar-in">
    <button type="button" class="btn" id="btnSave">完成並儲存</button>
    <button type="button" class="btn btn-red-out" id="btnClear">清空本次輸入</button>
  </div>
</div>
<script>
const KEY='fitnessTrackerGD_v2';
const $=id=>document.getElementById(id);
const LOWER=[
  {r:'主力・臀大肌',n:'槓鈴臀推',rep:'8–12下',m:'glute',ml:'臀大肌',t:['上背靠椅緣，槓鈴墊放髖部','下巴微收、肋骨收，頂端夾臀停1秒','小腿在頂端接近垂直'],w:'不要用腰椎過度後仰撐高'},
  {r:'主力・臀腿後側',n:'羅馬尼亞硬舉',rep:'8–10下',m:'post',ml:'臀・腿後側',t:['膝微彎，屁股往後推','槓貼腿下滑到大腿後側有拉伸','背保持中立，起身靠臀發力'],w:'下背痠緊就減重、縮短行程'},
  {r:'單腳・臀部穩定',n:'保加利亞分腿蹲',rep:'每腳8–12下',m:'uni',ml:'臀・前大腿',t:['後腳放椅上，前腳離椅約一大步','上身微前傾，重心放前腳','下蹲至前大腿接近水平'],w:'前膝不要內扣，膝蓋痛就縮小深度'},
  {r:'腿部維持',n:'45度腿推（高腳位）',rep:'10–12下',m:'quad',ml:'大腿・臀',t:['腳放踏板偏上、與肩同寬或略寬','下放到臀不離開椅背為止','推起時膝蓋不要完全鎖死'],w:'屁股捲起離墊代表太深'},
  {r:'補強・臀中肌',n:'髖外展機',rep:'12–20下',m:'gmed',ml:'臀中肌',t:['上身可微前傾','向外推到底停1秒','慢慢回'],w:'不要晃動身體借力'},
  {r:'補強・內收肌',n:'夾腿機',rep:'12–15下',m:'add',ml:'大腿內收',t:['坐穩背貼椅背','控制速度夾緊、慢放','起始角度選不拉痛的範圍'],w:'鼠蹊部刺痛就減小開腿角度'},
  {r:'收尾・臀部',n:'單腳臀橋',rep:'每腳12–15下',m:'glute',ml:'臀部',t:['瑜珈墊上，支撐腳靠近臀部','另一腳抬起用腳跟推地','頂端骨盆保持水平'],w:'大腿後側抽筋就把腳再靠近一點'}
];
const UPPER=[
  {r:'垂直拉・背闊肌',n:'滑輪下拉',rep:'10–12下',m:'lat',ml:'背闊肌',t:['握距略寬於肩、胸口微挺','手肘往下往口袋方向拉','拉到下巴到上胸之間'],w:'不要身體大幅後仰擺盪'},
  {r:'水平拉・中背',n:'坐姿划船（平拉）',rep:'10–12下',m:'midback',ml:'中背',t:['坐直','先收肩胛再彎手肘','拉到肚臍附近停1秒'],w:'不要聳肩、不要用腰往後倒'},
  {r:'垂直拉・背部',n:'輔助引體向上',rep:'6–10下',m:'lat',ml:'背部',t:['使用輔助或彈力帶','先下沉肩胛再拉起','下放控制2–3秒'],w:'肩前側不適就改回滑輪下拉'},
  {r:'胸推・胸大肌',n:'坐姿胸推機',rep:'8–12下',m:'chest',ml:'胸大肌',t:['握把約在胸中線高度','肩胛微收、背貼椅背','推出時手肘不完全鎖死'],w:'肩膀往前聳就降低重量'},
  {r:'胸・夾胸',n:'蝴蝶機夾胸',rep:'12–15下',m:'chest',ml:'胸大肌',t:['手肘微彎固定角度','像抱大樹往中間合','回程到胸口有伸展就好'],w:'不要拉過身體後方'},
  {r:'肩後側・姿勢',n:'蝴蝶機反向飛鳥',rep:'12–15下',m:'rdelt',ml:'後三角',t:['面向椅背坐，握把與肩同高','手臂往兩側打開','感受後肩'],w:'不要聳肩'},
  {r:'肩・側三角',n:'繩索/啞鈴側平舉',rep:'12–15下',m:'sdelt',ml:'側三角',t:['小重量、手肘微彎','抬到與肩同高','慢放2秒'],w:'過重容易變成斜方肌出力'},
  {r:'肩・旋轉肌',n:'繩索臉拉',rep:'12–15下',m:'rot',ml:'旋轉肌・後肩',t:['滑輪調到臉部高度','往額頭方向拉、手肘高','最後外旋停1秒'],w:'不要身體後仰'},
  {r:'手臂・三頭',n:'繩索三頭下壓',rep:'12–15下',m:'tri',ml:'三頭肌',t:['上臂貼身側固定','向下壓到手臂伸直','底部把繩索往外分開'],w:'手肘不要前後晃動'}
];
const BACK=new Set(['glute','post','gmed','lat','midback','rdelt','rot','tri']);
const MUS={
  glute:'<ellipse cx="25.5" cy="46" rx="4.2" ry="5"/><ellipse cx="34.5" cy="46" rx="4.2" ry="5"/>',
  post:'<ellipse cx="25.5" cy="46" rx="4" ry="4.5"/><ellipse cx="34.5" cy="46" rx="4" ry="4.5"/><ellipse cx="24.5" cy="59" rx="3" ry="7"/><ellipse cx="35.5" cy="59" rx="3" ry="7"/>',
  uni:'<ellipse cx="24.5" cy="56" rx="3.4" ry="8"/><ellipse cx="21" cy="45" rx="2.5" ry="4.5"/>',
  quad:'<ellipse cx="24.5" cy="57" rx="3.3" ry="8"/><ellipse cx="35.5" cy="57" rx="3.3" ry="8"/>',
  gmed:'<ellipse cx="21.5" cy="43" rx="2.6" ry="4.5"/><ellipse cx="38.5" cy="43" rx="2.6" ry="4.5"/>',
  add:'<ellipse cx="27.5" cy="56" rx="2.2" ry="7"/><ellipse cx="32.5" cy="56" rx="2.2" ry="7"/>',
  lat:'<path d="M22 25l5 3-1 11-4-3zM38 25l-5 3 1 11 4-3z"/>',
  midback:'<ellipse cx="30" cy="29" rx="5.5" ry="6"/>',
  chest:'<ellipse cx="25.5" cy="27" rx="4" ry="3.2"/><ellipse cx="34.5" cy="27" rx="4" ry="3.2"/>',
  rdelt:'<circle cx="20" cy="23" r="3"/><circle cx="40" cy="23" r="3"/>',
  sdelt:'<ellipse cx="18.5" cy="24" rx="2.4" ry="3.8"/><ellipse cx="41.5" cy="24" rx="2.4" ry="3.8"/>',
  rot:'<circle cx="20" cy="23" r="2.8"/><circle cx="40" cy="23" r="2.8"/><rect x="24" y="23" width="12" height="5" rx="2"/>',
  tri:'<ellipse cx="17.5" cy="31" rx="2.2" ry="5"/><ellipse cx="42.5" cy="31" rx="2.2" ry="5"/>',
  core:'<rect x="26" y="31" width="8" height="12" rx="3"/>'
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function mkSvg(k,lbl){
  const mid=BACK.has(k)?'<path d="M30 19v18" stroke-dasharray="2 2" opacity=".4"/>':'<path d="M24 21q6 2 12 0" opacity=".4"/>';
  const body='<circle cx="30" cy="10" r="5.5"/><path d="M27 16v3l-9 3-4 18h4l3-13M33 16v3l9 3 4 18h-4l-3-13M21 24l1 19-3 33h7l4-26 4 26h7l-3-33 1-19"/>';
  return '<svg viewBox="0 0 60 80" fill="none" stroke="#284c51" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+body+mid+'<g fill="#b83c35" stroke="none" opacity=".88">'+(MUS[k]||'')+'</g></svg><div class="ex-muscle">'+lbl+'</div>';
}
function setNow(){
  const d=new Date();
  $('dt').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
}
function renderGroup(id,list){
  $(id).innerHTML=list.map((ex,i)=>{
    let rows='';
    for(let s=1;s<=4;s++){
      rows+='<div class="set-row"><span class="set-num">'+s+'</span>';
      rows+='<input type="checkbox" class="set-chk">';
      rows+='<input type="number" step="0.5" inputmode="decimal" class="set-in in-w" placeholder="kg">';
      rows+='<input type="number" inputmode="numeric" class="set-in in-r" placeholder="次">';
      rows+='<input type="number" step="0.5" inputmode="decimal" class="set-in in-rir" placeholder="RIR"></div>';
    }
    const tips=ex.t.map(x=>'<li>'+x+'</li>').join('');
    let h='<div class="card ex-card" data-i="'+i+'">';
    h+='<div class="ex-head"><div class="ex-info"><span class="ex-role">'+ex.r+'</span>';
    h+='<h2 class="ex-name">'+ex.n+'</h2><div class="ex-reps">建議：'+ex.rep+'</div></div>';
    h+='<div class="ex-svg">'+mkSvg(ex.m,ex.ml)+'</div></div>';
    h+='<details><summary>動作注意事項</summary><ul class="tips-ul">'+tips+'</ul>';
    h+='<div class="warn">注意：'+ex.w+'</div></details>';
    h+='<div class="set-hdr"><span>組</span><span>完成</span><span>重量kg</span><span>次數</span><span>RIR</span></div>';
    return h+rows+'<input type="text" class="ex-note" placeholder="動作備註..."></div>';
  }).join('');
}
let curTab='lower',tSec=0,tBase=0,tStart=0,tId=null,manualMin=false;
const pad=n=>String(n).padStart(2,'0');
function updTimer(){
  $('tDisp').textContent=pad(Math.floor(tSec/60))+':'+pad(tSec%60);
  if(!manualMin&&tSec>0)$('totalMin').value=Math.max(1,Math.round(tSec/60));
}
function stopTimer(){
  if(tId){clearInterval(tId);tId=null;}
}
function resetTimer(){
  stopTimer();tSec=0;tBase=0;tStart=0;manualMin=false;
  $('tDisp').textContent='00:00';$('tBtn').textContent='開始';$('totalMin').value='';
}
$('tBtn').onclick=()=>{
  if(tId){
    tSec=tBase+Math.floor((Date.now()-tStart)/1000);
    tBase=tSec;stopTimer();updTimer();$('tBtn').textContent='繼續';
  }else{
    tStart=Date.now();
    tId=setInterval(()=>{tSec=tBase+Math.floor((Date.now()-tStart)/1000);updTimer();},500);
    $('tBtn').textContent='暫停';
  }
};
$('tRst').onclick=resetTimer;
$('totalMin').oninput=()=>{manualMin=true;};
$('status').onchange=()=>{
  $('statusOther').classList.toggle('hide',$('status').value!=='其他');
};
$('openVid').onclick=()=>{
  let u=$('cUrl').value.trim();
  if(!u){alert('請先輸入影片網址');return;}
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  window.open(u,'_blank','noopener');
};
document.addEventListener('change',e=>{
  if(e.target.classList.contains('set-chk')){
    e.target.closest('.set-row').classList.toggle('done',e.target.checked);
  }
});
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+t));
  $('bbar').classList.toggle('hide',t==='history');
  if(t==='history')renderHist();
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)switchTab(b.dataset.t);};
function loadRecs(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(d)?d:[];}
  catch(e){return [];}
}
function saveRecs(arr){localStorage.setItem(KEY,JSON.stringify(arr));}
function clearCurrent(ask){
  if(ask&&!confirm('確定要清空本次輸入嗎？'))return;
  if(curTab==='core'){
    $('cUrl').value='';$('cMin').value='10';$('cComp').value='完整完成';$('cNote').value='';
  }else if(curTab==='lower'||curTab==='upper'){
    const p=$('p-'+curTab);
    p.querySelectorAll('.set-in,.ex-note').forEach(el=>el.value='');
    p.querySelectorAll('.set-chk').forEach(el=>el.checked=false);
    p.querySelectorAll('.set-row').forEach(el=>el.classList.remove('done'));
  }
}
$('btnClear').onclick=()=>clearCurrent(true);
$('btnSave').onclick=()=>{
  const st=$('status').value==='其他'?($('statusOther').value.trim()||'其他'):$('status').value;
  if(tId){
    tSec=tBase+Math.floor((Date.now()-tStart)/1000);
    tBase=tSec;stopTimer();updTimer();$('tBtn').textContent='繼續';
  }
  const tMin=$('totalMin').value.trim();
  const rec={id:Date.now(),dt:$('dt').value,status:st,totalMin:tMin,timer:$('tDisp').textContent};
  if(curTab==='core'){
    rec.type='核心腹肌';
    rec.core={url:$('cUrl').value.trim(),min:$('cMin').value.trim()||'0',comp:$('cComp').value,note:$('cNote').value.trim()};
  }else{
    rec.type=curTab==='lower'?'下肢日':'上肢日';
    const src=curTab==='lower'?LOWER:UPPER;
    const items=[];let filled=0;
    $('p-'+curTab).querySelectorAll('.ex-card').forEach((c,i)=>{
      const sets=[];
      c.querySelectorAll('.set-row').forEach((r,idx)=>{
        const w=r.querySelector('.in-w').value.trim();
        const rp=r.querySelector('.in-r').value.trim();
        const rir=r.querySelector('.in-rir').value.trim();
        if(w!==''||rp!==''||rir!==''){
          sets.push({s:idx+1,w,r:rp,rir,done:r.querySelector('.set-chk').checked});
          filled++;
        }
      });
      const note=c.querySelector('.ex-note').value.trim();
      if(sets.length||note)items.push({name:src[i].n,sets,note});
    });
    if(!filled){alert('下肢或上肢訓練至少要填寫一組才能儲存。');return;}
    rec.items=items;
  }
  const all=loadRecs();all.push(rec);saveRecs(all);
  clearCurrent(false);resetTimer();setNow();
  alert('已儲存本次紀錄！');switchTab('history');
};
function renderHist(){
  const list=loadRecs().sort((a,b)=>(b.dt||'').localeCompare(a.dt||'')||(b.id-a.id));
  if(!list.length){$('histList').innerHTML='<div class="empty">目前尚無訓練紀錄</div>';return;}
  $('histList').innerHTML=list.map(r=>{
    const dur=r.totalMin?(r.totalMin+' 分鐘'):(r.timer&&r.timer!=='00:00'?r.timer:'未填');
    let body='';
    if(r.type==='核心腹肌'&&r.core){
      const c=r.core;
      let uHtml='';
      if(c.url){
        const href=/^https?:\/\//i.test(c.url)?c.url:'https://'+c.url;
        uHtml='<div class="hist-sets">影片：<a class="hist-link" href="'+esc(href)+'" target="_blank" rel="noopener">開啟影片</a></div>';
      }
      body='<div class="hist-ex"><div class="hist-sets">核心實做：'+esc(c.min)+' 分鐘｜完成程度：'+esc(c.comp)+'</div>'+uHtml;
      if(c.note)body+='<div class="hist-note">備註：'+esc(c.note)+'</div>';
      body+='</div>';
    }else if(r.items){
      body=r.items.map(it=>{
        const sh=it.sets.map(s=>{
          const w=s.w?esc(s.w)+'kg':'-';
          const rp=s.r?esc(s.r)+'下':'-';
          return '第'+s.s+'組：'+w+' × '+rp+(s.rir?'，RIR '+esc(s.rir):'');
        }).join('<br>');
        let h='<div class="hist-ex"><div class="hist-ex-t">'+esc(it.name)+'</div>';
        if(sh)h+='<div class="hist-sets">'+sh+'</div>';
        if(it.note)h+='<div class="hist-note">備註：'+esc(it.note)+'</div>';
        return h+'</div>';
      }).join('');
    }
    return '<div class="hist-card"><div class="hist-top"><span class="hist-tag">'+esc(r.type)+'</span><button type="button" class="btn btn-red-out btn-sm" data-del="'+r.id+'">刪除此筆</button></div><div class="hist-meta">'+esc((r.dt||'').replace('T',' '))+'｜狀態：'+esc(r.status)+'｜總時長：'+esc(dur)+'</div>'+body+'</div>';
  }).join('');
}
$('histList').onclick=e=>{
  const b=e.target.closest('[data-del]');
  if(!b||!confirm('確定要刪除此筆紀錄嗎？'))return;
  saveRecs(loadRecs().filter(x=>String(x.id)!==b.dataset.del));
  renderHist();
};
$('btnExp').onclick=()=>{
  const data=JSON.stringify(loadRecs(),null,2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download='fitnessTrackerGD_v2_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};
$('btnImp').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const arr=JSON.parse(rd.result);
      if(!Array.isArray(arr))throw 0;
      if(!confirm('將匯入 '+arr.length+' 筆紀錄並取代目前資料，確定嗎？'))return;
      saveRecs(arr);renderHist();alert('匯入完成！');
    }catch(err){alert('檔案格式錯誤，請選擇正確的 JSON 備份檔。');}
    e.target.value='';
  };
  rd.readAsText(f);
};
$('btnClrAll').onclick=()=>{
  if(!confirm('確定要清除全部歷史紀錄嗎？此動作無法復原。'))return;
  localStorage.removeItem(KEY);renderHist();
};
renderGroup('p-lower',LOWER);
renderGroup('p-upper',UPPER);
$('coreSvg').innerHTML=mkSvg('core','核心腹肌');
setNow();
</script>
</body>
</html>
